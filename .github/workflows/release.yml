name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Обязательно для работы Trusted Publishing

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Pack NuGet Package
      # Добавлен флаг /p:TreatWarningsAsErrors=false, чтобы сборка не падала из-за варнингов
      run: dotnet pack ./BackBlaze.Client/BackBlaze.Client/BackBlaze.Client.csproj --configuration Release --output ./artifacts /p:TreatWarningsAsErrors=false

    - name: Publish to NuGet.org
      run: dotnet nuget push ./artifacts/*.nupkg --source https://api.nuget.org/v3/index.json